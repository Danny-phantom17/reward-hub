services:
  - type: web
    name: rewardhub
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci
    preDeployCommand: node scripts/migrate.js
    startCommand: npm start
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: rewardhub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BANK_DETAILS_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADVERTISER_FUNDING_INSTRUCTIONS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        fromService:
          name: rewardhub
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: rewardhub-db
    databaseName: rewardhub
    user: rewardhub_user
    postgresMajorVersion: "18"
    plan: 0.1c-256mb
    diskSizeGB: 1
